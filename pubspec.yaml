name: moto_touring_nav
description: Ultra-low power, offline-first motorcycle touring navigation with background voice intercom and universal media control.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Realtime Cloud
  supabase_flutter: ^2.5.0

  # SFU Voice Intercom (WebRTC + Opus + VAD)
  livekit_client: ^2.1.0

  # Offline Navigation, Geometry & Voice
  flutter_tts: ^4.0.2
  latlong2: ^0.9.1

  # Local Persistence (Lightweight offline buffer)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Utilities
  share_plus: ^9.0.0
  intl: ^0.19.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
